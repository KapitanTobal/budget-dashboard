<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>Monthly Budget Dashboard</title>
  
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
  
    <meta name="theme-color" content="#007aff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    >
  </head>
  
<body>
    <nav>
        <a href="index.html">Budget</a>
        <a href="subscriptions.html">Subscriptions</a>
      </nav>

      <section>
        <h2>Track a Subscription</h2>
      
        <form id="subscription-form">
          <label for="subscription-name">Subscription name:</label>
          <input type="text" id="subscription-name" required>
      
          <label for="subscription-amount">Amount:</label>
          <input
            type="number"
            id="subscription-amount"
            min="0.01"
            step="0.01"
            required
          >
      
          <label for="billing-cycle">Billing cycle:</label>
          <select id="billing-cycle" required>
            <option value="">Choose a cycle</option>
            <option value="Monthly">Monthly</option>
            <option value="Yearly">Yearly</option>
          </select>
      
          <label for="next-payment">Next payment date:</label>
          <input type="date" id="next-payment" required>
      
          <label>
            <input type="checkbox" id="autopay">
            Automatic payment
          </label>
      
          <button type="submit">Add Subscription</button>
        </form>
      </section>
      
      <section>
        <h2>Subscriptions</h2>
        <p>Total monthly subscriptions: $<span id="subscription-total">0.00</span></p>
        <ul id="subscription-list"></ul>
      </section>

      <script src="subscriptions.js"></script>
      <script src="pwa.js"></script>
    
</body>
</html>
